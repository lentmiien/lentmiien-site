openapi: 3.0.3
info:
  title: Smallest Box Packing API
  version: 1.2.0
  description: Search the shared saved box catalog for one container that holds all items. Create a scoped key in the tool's API access section.
servers:
  - url: /
security:
  - packingKey: []
paths:
  /api/binpacking-smallest/containers:
    get:
      operationId: listPackingContainers
      summary: Fetch shared boxes and available tags
      description: >-
        Read-only snapshot of up to 50 shared boxes, the catalog revision, and sorted unique tags.
        Uses the same bearer key as searches. No query parameters or request body.
        Shares the API limit of 60 requests/minute/IP; does not consume search quota.
        Responses are private and no-store. No catalog mutation is exposed through this API.
      responses:
        '200':
          description: Shared catalog; empty containers and tags arrays when no boxes are saved.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [containers, revision, tags]
                properties:
                  containers:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/Container'
                  revision:
                    type: integer
                    minimum: 0
                    description: Snapshot revision; searches always use the latest saved catalog.
                  tags:
                    type: array
                    uniqueItems: true
                    maxItems: 1000
                    description: Sorted unique union of all container tags; no tags gives an empty array.
                    items:
                      type: string
                      minLength: 1
                      maxLength: 40
                      pattern: '^[a-z0-9][a-z0-9_-]{0,39}$'
        '400':
          description: Query parameters are not accepted.
        '401':
          description: Missing, invalid, expired, revoked or insufficiently scoped key, or issuer access revoked.
        '429':
          description: API rate limit reached.
        '503':
          description: Shared catalog unavailable.
  /api/binpacking-smallest:
    post:
      operationId: findSmallestBox
      summary: Find up to three single-box solutions
      description: >-
        Filters shared boxes by tags, usable dimensions, volume and estimated contents weight including cushion,
        then tries increasing full internal volume until three solutions are found.
        The primary solution remains in container/data/meta; alternatives contains up to two more.
        safetyMarginMm defaults to 10 per side (20 mm removed from each dimension); use 0 for no margin.
        Require-not tags take priority; boxes with no matching filter tags are included.
        Positive require tags are not a strict whitelist. Empty filters include all boxes.
        Limits are 5 searches/minute per key issuer and one concurrent search per issuer,
        shared with browser searches. Maximum search duration is 60 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                algorithm:
                  type: string
                  enum: [laff, plain, bruteforce]
                  default: laff
                safetyMarginMm:
                  type: number
                  minimum: 0
                  maximum: 500000
                  default: 10
                  description: Cushion zone at each box wall in mm; subtract twice this from every dimension. Does not enforce gaps between items.
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Unique IDs; at most 200 total items, or 7 with bruteforce.
                  items:
                    $ref: '#/components/schemas/Item'
                tagFilter:
                  type: object
                  additionalProperties: false
                  properties:
                    require:
                      $ref: '#/components/schemas/Tags'
                    requireNot:
                      $ref: '#/components/schemas/Tags'
      responses:
        '200':
          description: Primary solution plus up to two alternatives, or success false when no fit is found.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Solution'
                  - type: object
                    required: [alternatives]
                    properties:
                      alternatives:
                        type: array
                        maxItems: 2
                        description: Additional independent single-box solutions in ascending full volume order. Empty when none found. Never pack these containers together.
                        items:
                          $ref: '#/components/schemas/Solution'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          description: Missing, invalid, expired, revoked or insufficiently scoped key, or issuer access revoked.
        '413':
          description: JSON body exceeds 64 KiB.
        '429':
          description: Rate or concurrency limit reached.
        '503':
          description: Catalog or packing worker unavailable, or search time limit reached before any solution. Completed solutions are returned with alternativesSearchComplete false if a later attempt fails.
components:
  securitySchemes:
    packingKey:
      type: http
      scheme: bearer
      description: Scoped svc_ key issued on /binpacking-smallest. Cookies and the legacy global API key are not accepted.
  responses:
    Invalid:
      description: Invalid JSON, fields, quantities, dimensions, weights or tags.
  schemas:
    Solution:
      type: object
      required: [success, meta]
      properties:
        success:
          type: boolean
        message:
          type: string
        estimatedCushionWeight:
          type: number
          minimum: 0
          description: Kilograms, using full empty box volume (including wall margins) times 8.22 kg/m³.
        estimatedShipmentWeight:
          type: number
          minimum: 0
          description: Kilograms; box plus all item quantities plus estimated cushion weight.
        container:
          $ref: '#/components/schemas/Container'
        data:
          type: object
          properties:
            success:
              type: boolean
            containersUsed:
              type: integer
              enum: [1]
            pallets:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: object
                properties:
                  containerId:
                    type: string
                  w:
                    type: number
                  d:
                    type: number
                  h:
                    type: number
                  placements:
                    type: array
                    items:
                      type: object
                      required: [itemId, x, y, z, w, d, h]
                      properties:
                        itemId:
                          type: string
                        x:
                          type: number
                          description: Width coordinate in mm from the full box corner, already including margin offset.
                        y:
                          type: number
                          description: Depth coordinate in mm from the full box corner, already including margin offset.
                        z:
                          type: number
                          description: Height coordinate in mm from the full box corner, already including margin offset.
                        w:
                          type: number
                        d:
                          type: number
                        h:
                          type: number
        meta:
          type: object
          properties:
            safetyMarginMm:
              type: number
              description: Applied margin per box wall, in mm.
            cushionDensityKgPerM3:
              type: number
              enum: [8.22]
            emptyVolume:
              type: number
              description: Full internal box volume minus total item volume, in cubic millimeters.
            usableDimensions:
              type: object
              required: [w, d, h]
              properties:
                w:
                  $ref: '#/components/schemas/Dimension'
                d:
                  $ref: '#/components/schemas/Dimension'
                h:
                  $ref: '#/components/schemas/Dimension'
            alternativesSearchComplete:
              type: boolean
              description: True when three solutions were found or all candidates exhausted; false if worker failure or deadline interrupted a search after a solution was found.
            algorithm:
              type: string
            totalItemCount:
              type: integer
            uniqueItems:
              type: integer
            totalContainers:
              type: integer
            tagFilteredContainers:
              type: integer
            eligibleContainers:
              type: integer
            filteredContainers:
              type: integer
            attempts:
              type: integer
              description: Total worker calls across the primary and alternative search.
            containerId:
              type: string
            containerVolume:
              type: number
              description: Cubic millimeters.
    Dimension:
      type: number
      minimum: 0
      exclusiveMinimum: true
      maximum: 1000000
      description: Internal millimeters.
    Weight:
      type: number
      minimum: 0
      maximum: 1000000
      description: Kilograms.
    Tags:
      type: array
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 40
      description: Trimmed and lowercased; then letters a-z, digits, hyphen and underscore only, starting with a letter or digit.
    Item:
      type: object
      additionalProperties: false
      required: [id, w, d, h, weight, qty]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        w:
          $ref: '#/components/schemas/Dimension'
        d:
          $ref: '#/components/schemas/Dimension'
        h:
          $ref: '#/components/schemas/Dimension'
        weight:
          $ref: '#/components/schemas/Weight'
        qty:
          type: integer
          minimum: 1
          maximum: 200
    Container:
      type: object
      properties:
        id:
          type: string
        w:
          $ref: '#/components/schemas/Dimension'
        d:
          $ref: '#/components/schemas/Dimension'
        h:
          $ref: '#/components/schemas/Dimension'
        emptyWeight:
          $ref: '#/components/schemas/Weight'
        maxLoadWeight:
          $ref: '#/components/schemas/Weight'
        tags:
          $ref: '#/components/schemas/Tags'
